apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    
    defaultConfig {
        applicationId "car.bkrc.com.car2022"
        minSdkVersion 24
        versionCode 1
        versionName "2022-V1.2"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            moduleName "serial_port"
            ldLibs "log", "z", "m"
//            abiFilters "armeabi", "armeabi-v7a"

            abiFilters 'armeabi-v7a'
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {
    }

    buildFeatures{
        dataBinding = true
    }

    sourceSets{
        main{
            jniLibs.srcDirs = ['src/main/jniLibs']
            jni.srcDirs = ['src/main/jin', 'src/main/jni/', 'src\\main\\jni']
            assets {
                srcDirs 'src\\main\\assets'
            }
        }
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    externalNativeBuild {
        cmake {
            version "3.10.2"
            path file('src/main/jniLibs/CMakeLists.txt')
        }
    }


}

dependencies {
//    implementation 'top.zibin:Luban:1.1.3'
    implementation 'com.rmtheis:tess-two:9.1.0'
    implementation 'androidx.annotation:annotation:1.0.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/camerautil.jar')
//    implementation files('libs/core.jar')
    //noinspection GradleCompatible
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation project(path: ':open330')

    testImplementation 'junit:junit:4.12'
    implementation project(':library')
    implementation files('libs/usbSerialForAndroid-debug.aar')
    implementation files('libs/easyedge-sdk.jar')
    implementation files('libs/BottomNavigationViewLibrary-debug.aar')
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.7'
    implementation 'com.github.castorflex.verticalviewpager:library:19.0.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'org.tensorflow:tensorflow-lite:2.5.0'
    implementation 'com.google.protobuf:protobuf-java:3.15.8'
    implementation files('libs/libandroid_tensorflow_inference_java.jar')

    implementation 'com.google.zxing:core:3.3.3'
}
